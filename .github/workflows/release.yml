name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # The whole history: the app's version code is the commit count, as
      # scripts/devdeploy.sh counts it, so a release always installs over
      # the builds before it (Android refuses a lower code).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check and build the frontend
        run: |
          npm run typecheck
          npm test
          npm run build
          test -s internal/web/assets/static/app/app.js
          test -s internal/web/assets/static/admin/admin.js
          scripts/check-sinks.sh

      # The Android app of this release, embedded in every server binary
      # (PLAN.md 7.6). The release key is a secret (base64 of the keystore,
      # its password, its alias): never in git.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build and sign the Android app
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          [ -n "$KEYSTORE_B64" ] || { echo "the ANDROID_KEYSTORE_B64 secret is missing"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          version="${GITHUB_REF_NAME#v}"
          make -C android test SDK="$ANDROID_SDK_ROOT" JAVA_HOME="$JAVA_HOME" LIB="$RUNNER_TEMP/lib"
          args=(SDK="$ANDROID_SDK_ROOT" JAVA_HOME="$JAVA_HOME" KEYSTORE="$RUNNER_TEMP/release.keystore" KS_PASS="$KS_PASS" KEY_ALIAS="$KEY_ALIAS")
          make -C android apk "${args[@]}" VERSION="$version" VERSION_CODE="$(git rev-list --count HEAD)"
          cp android/build/agendouille.apk internal/web/assets/apk/agendouille.apk
          make -s -C android cert "${args[@]}" > internal/web/assets/apk/cert.txt
          echo "$version" > internal/web/assets/apk/version.txt
          cp android/build/agendouille.apk "agendouille-$version.apk"
          rm -f "$RUNNER_TEMP/release.keystore"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: false

      - name: Test
        run: go test -race ./...

      # Static, cgo off, both bundles and the APK embedded: each file is
      # the whole server.
      - name: Build for every target
        env:
          CGO_ENABLED: '0'
        run: |
          version="${GITHUB_REF_NAME#v}"
          build() {
            GOOS="$1" GOARCH="$2" GOARM="${4:-}" go build \
              -trimpath \
              -ldflags="-s -w -X main.version=$version" \
              -o "$3" ./cmd/agendouille
            echo "  $3: $(stat -c%s "$3") bytes"
          }
          build linux amd64 agendouille-linux-amd64
          build linux arm64 agendouille-linux-arm64
          build linux arm   agendouille-linux-armv7 7

      # The binary runs, reports exactly the tagged version, serves
      # /healthz with it, and embeds the admin bundle.
      - name: Smoke test the linux amd64 build
        run: |
          version="${GITHUB_REF_NAME#v}"
          printed=$(./agendouille-linux-amd64 version)
          echo "$printed"
          [ "$printed" = "agendouille $version" ] || { echo "the binary does not report the tagged version"; exit 1; }

          data=$(mktemp -d)
          # serve refuses to start without an admin password, as install.sh sets one.
          ./agendouille-linux-amd64 admin passwd --random -data-dir "$data" >/dev/null
          ./agendouille-linux-amd64 serve -admin-listen 127.0.0.1:18792 -data-dir "$data" >"$data/out" 2>&1 &
          pid=$!
          for _ in $(seq 50); do curl -fsS http://127.0.0.1:18792/healthz >/dev/null 2>&1 && break; sleep 0.2; done
          health=$(curl -fsS http://127.0.0.1:18792/healthz) || { cat "$data/out"; exit 1; }
          echo "healthz: $health"
          [ "$health" = "ok $version" ] || { echo "/healthz does not report the tagged version"; exit 1; }
          curl -fsS -o /dev/null http://127.0.0.1:18792/static/admin/admin.js || { echo "the admin bundle is not embedded"; exit 1; }
          # The APK is on the public surface; the smoke test has none, so the
          # embed is checked in the binary itself.
          grep -q "io.github.nebuloss.agendouille" agendouille-linux-amd64 || { echo "the APK is not embedded"; exit 1; }
          kill "$pid"
          wait "$pid" || true

      - name: Checksums
        run: |
          sha256sum agendouille-linux-* agendouille-*.apk > SHA256SUMS
          cat SHA256SUMS
          [ "$(wc -l < SHA256SUMS)" -eq 4 ] || { echo "SHA256SUMS should list 4 files"; exit 1; }

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            agendouille-linux-amd64
            agendouille-linux-arm64
            agendouille-linux-armv7
            agendouille-*.apk
            SHA256SUMS
          generate_release_notes: true

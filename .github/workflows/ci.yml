name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Separate from build: vite strips types without checking them.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build both bundles
        run: npm run build

      # Go embeds whatever is in these directories, so a missing bundle
      # would ship a binary without that UI and nothing else would fail.
      - name: Check both bundles were produced
        run: |
          for b in app admin; do
            f="internal/web/assets/static/$b/$b.js"
            test -s "$f"
            echo "$f: $(stat -c%s "$f") bytes"
          done

      - name: No HTML sinks in src/
        run: scripts/check-sinks.sh

      - uses: actions/upload-artifact@v4
        with:
          name: frontend
          path: |
            internal/web/assets/static/app/app.js
            internal/web/assets/static/admin/admin.js
          retention-days: 1
          if-no-files-found: error

  server:
    name: Server
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: false

      - uses: actions/download-artifact@v4
        with:
          name: frontend
          path: internal/web/assets/static

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Check go.mod is tidy
        run: |
          go mod tidy
          if ! git diff --quiet go.mod go.sum; then
            echo "go.mod or go.sum is not tidy. Run: go mod tidy"
            git diff go.mod go.sum
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race ./...

  cross-build:
    name: Cross-build
    runs-on: ubuntu-latest
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: arm, goarm: '7' }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: false

      - uses: actions/download-artifact@v4
        with:
          name: frontend
          path: internal/web/assets/static

      # cgo stays off everywhere. A dependency that quietly needs it breaks
      # these targets without breaking a single test.
      - name: Build for ${{ matrix.goos }}/${{ matrix.goarch }}${{ matrix.goarm }}
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: go build -trimpath -ldflags='-s -w' -o /dev/null ./cmd/agendouille

  shell:
    name: Shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shellcheck
        run: shellcheck scripts/*.sh

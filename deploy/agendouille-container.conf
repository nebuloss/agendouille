# agendouille in a container: /etc/systemd/system/agendouille.service.d/container.conf
#
# INSTALLED ONLY WHEN THE STRICT UNIT WILL NOT START. deploy/install.sh
# tries the unit as shipped first and drops this in only if systemd fails
# it with 226/NAMESPACE (or 219/CGROUP).
#
# In an UNPRIVILEGED container the kernel refuses the mount-namespace tricks
# below, and systemd fails the service with a status that looks exactly
# like a broken binary. What is given up is defence in depth against a
# compromised process; what is kept is everything that does not need to
# mount: no new privileges, no capabilities, a system call filter, and
# write access to one directory. The container is the boundary those
# options were duplicating.

[Service]
PrivateDevices=no
ProtectKernelTunables=no
ProtectKernelModules=no
ProtectKernelLogs=no
ProtectControlGroups=no
ProtectClock=no
ProtectHostname=no
ProtectProc=default

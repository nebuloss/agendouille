<h1>Bienvenue</h1>
{{with .Data}}
{{if .Error}}
<p role="alert">{{.Error}}</p>
<p>Demandez un nouveau lien à la personne qui gère agendouille.</p>
{{else}}
<p>Ce lien connecte cet appareil à agendouille. Il ne marche qu'une fois.</p>
<form method="post" action="/enrol/{{.Token}}">
  <button type="submit">Continuer</button>
</form>
{{end}}
{{end}}

{{define "navitems"}}
<a href="/" class="group flex flex-1 flex-col items-center gap-1 pt-3 pb-4 text-xs font-semibold text-on-surface-variant no-underline aria-[current=page]:text-on-surface md:flex-none md:pt-0 md:pb-1" {{if eq .Page "calendar"}}aria-current="page"{{end}}>
  <span class="state-layer grid h-8 w-16 place-items-center rounded-full group-aria-[current=page]:bg-secondary-container group-aria-[current=page]:text-on-secondary-container md:w-14"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7a2 2 0 012-2h12a2 2 0 012 2v12a2 2 0 01-2 2H6a2 2 0 01-2-2z M4 10h16 M8 3v4 M16 3v4"/></svg></span>{{t "app.nav.calendar"}}</a>
<a href="/calendars" class="group flex flex-1 flex-col items-center gap-1 pt-3 pb-4 text-xs font-semibold text-on-surface-variant no-underline aria-[current=page]:text-on-surface md:flex-none md:pt-0 md:pb-1" {{if eq .Page "calendars"}}aria-current="page"{{end}}>
  <span class="state-layer grid h-8 w-16 place-items-center rounded-full group-aria-[current=page]:bg-secondary-container group-aria-[current=page]:text-on-secondary-container md:w-14"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8a2 2 0 012-2h10a2 2 0 012 2v10a2 2 0 01-2 2H5a2 2 0 01-2-2z M3 11h14 M7 4v4 M13 4v4 M20 9v9a3 3 0 01-3 3H8"/></svg></span>{{t "app.nav.calendars"}}</a>
<a href="/devices" class="group flex flex-1 flex-col items-center gap-1 pt-3 pb-4 text-xs font-semibold text-on-surface-variant no-underline aria-[current=page]:text-on-surface md:flex-none md:pt-0 md:pb-1" {{if eq .Page "devices"}}aria-current="page"{{end}}>
  <span class="state-layer grid h-8 w-16 place-items-center rounded-full group-aria-[current=page]:bg-secondary-container group-aria-[current=page]:text-on-secondary-container md:w-14"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6a2 2 0 012-2h10a2 2 0 012 2v2 M2 18h11 M4 6v9 M15 10a1 1 0 011-1h5a1 1 0 011 1v10a1 1 0 01-1 1h-5a1 1 0 01-1-1z M18 18h1"/></svg></span>{{t "app.nav.devices"}}</a>
<a href="/me" class="group flex flex-1 flex-col items-center gap-1 pt-3 pb-4 text-xs font-semibold text-on-surface-variant no-underline aria-[current=page]:text-on-surface md:flex-none md:pt-0 md:pb-1" {{if eq .Page "me"}}aria-current="page"{{end}}>
  <span class="state-layer grid h-8 w-16 place-items-center rounded-full group-aria-[current=page]:bg-secondary-container group-aria-[current=page]:text-on-secondary-container md:w-14"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 11.5a3.5 3.5 0 100-7 3.5 3.5 0 000 7z M5 20c.8-3.8 3.6-6 7-6s6.2 2.2 7 6"/></svg></span>{{t "app.nav.me"}}</a>
{{end}}
<div class="app min-h-screen md:pl-24" data-zone="{{.Zone}}" data-user="{{.User.Name}}">
<nav class="fixed inset-y-0 left-0 z-20 hidden w-24 flex-col items-center gap-5 bg-surface-low pt-4 md:flex" aria-label="agendouille">
  <a href="/" class="mb-3" aria-label="agendouille"><img src="/static/shared/icon.svg" alt="" width="44" height="44" class="rounded-md3-m"></a>
  {{template "navitems" .}}
</nav>
<header class="sticky top-0 z-40 flex h-16 items-center gap-3 bg-surface/95 px-4 backdrop-blur md:px-6">
  <img src="/static/shared/icon.svg" alt="" width="32" height="32" class="rounded-md3-s md:hidden">
  <h1 class="mr-auto truncate text-[22px] font-normal">{{.Title}}</h1>
  <!-- On a phone the title needs the room: the language and the theme are
       on the Moi page there. -->
  <div class="hidden items-center gap-2 sm:flex"><span data-lang-menu></span><span data-theme-toggle></span></div>
  <form method="post" action="/signout" class="contents">
    <button type="submit" class="state-layer grid size-10 shrink-0 place-items-center rounded-full text-on-surface-variant sm:inline-flex sm:h-9 sm:w-auto sm:gap-2 sm:px-3 sm:text-sm sm:font-medium sm:text-primary" title="{{t "app.signout"}}" aria-label="{{t "app.signout"}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4h4v16h-4 M10 8l-4 4 4 4 M6 12h11"/></svg><span class="hidden sm:inline">{{t "app.signout"}}</span></button>
  </form>
</header>
<section class="mx-auto flex w-full max-w-[1240px] flex-col gap-4 px-3 pb-28 sm:px-4 md:px-6 md:pb-10" id="app-content">
  <noscript><p class="rounded-md3-m bg-error-container px-4 py-2.5 text-on-error-container">{{t "app.noscript"}}</p></noscript>
  <p class="loading px-1 py-10 text-on-surface-variant">{{t "layout.loading"}}</p>
</section>
<nav class="fixed inset-x-0 bottom-0 z-20 flex bg-surface-container pb-[env(safe-area-inset-bottom)] md:hidden" aria-label="agendouille">
  {{template "navitems" .}}
</nav>
<div class="pointer-events-none fixed inset-x-0 bottom-24 z-50 flex flex-col items-center gap-2 px-4 md:bottom-6" id="toasts" aria-live="polite"></div>
</div>

<div class="flex min-h-screen items-start justify-center px-4 py-10 sm:items-center">
<div class="flex w-full max-w-[400px] flex-col gap-5 rounded-md3-xl bg-surface-container p-6 sm:p-8">
  <div class="flex items-center gap-3">
    <img src="/static/shared/icon.svg" alt="" width="44" height="44" class="rounded-md3-m">
    <div><p class="text-xs font-semibold tracking-wider text-on-surface-variant uppercase">agendouille</p>
    <h1 class="text-2xl font-normal">{{t "admin.title"}}</h1></div>
    <div class="ml-auto self-start"><span data-lang-menu></span></div>
  </div>
  {{if .Error}}<p role="alert" class="rounded-md3-m bg-error-container px-4 py-2.5 text-on-error-container">{{.Error}}</p>{{end}}
  <form method="post" action="/signin" class="flex flex-col gap-4">
    <label class="flex flex-col gap-1.5"><span class="text-xs font-semibold text-on-surface-variant">{{t "admin.signin.password"}}</span>
      <input type="password" name="password" autocomplete="current-password" required autofocus class="min-h-10 w-full rounded-md3-s border border-outline-variant bg-surface-lowest px-3 py-2 text-sm outline-none focus:border-primary">
    </label>
    <div class="flex justify-end"><button type="submit" class="state-layer inline-flex h-10 items-center rounded-md3-full bg-primary px-6 text-sm font-medium text-on-primary">{{t "admin.signin.submit"}}</button></div>
  </form>
</div>
</div>

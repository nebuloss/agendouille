<div class="admin min-h-screen">
<header class="flex h-16 items-center gap-3 px-4">
  <a href="/admin" class="flex items-center gap-2.5 text-on-surface no-underline"><img src="/static/shared/icon.svg" alt="" width="32" height="32" class="rounded-md3-s">
    <span class="text-lg font-semibold">agendouille</span><span class="hidden text-xs font-semibold text-on-surface-variant sm:inline">administration</span></a>
  <form method="post" action="/admin/signout" class="ml-auto"><button class="state-layer inline-flex h-10 items-center rounded-md3-full px-4 text-sm font-medium whitespace-nowrap text-primary" type="submit">Se déconnecter</button></form>
</header>
<div class="flex flex-col gap-4 px-3 pb-10 sm:px-4 lg:flex-row lg:items-start">
  <nav class="flex gap-1 overflow-x-auto rounded-md3-xl bg-surface-container p-2 lg:sticky lg:top-4 lg:w-60 lg:shrink-0 lg:flex-col" aria-label="Administration">
    {{template "adminnav" .}}
  </nav>
  <section class="flex min-w-0 flex-1 flex-col gap-4" id="admin-content" data-name="{{.Name}}">
    <h1 class="px-1 text-[28px] font-normal">{{.Title}}</h1>
    <noscript><p class="rounded-md3-m bg-error-container px-4 py-2.5 text-on-error-container">L'interface d'administration a besoin de JavaScript.</p></noscript>
    <p class="px-1 text-on-surface-variant" id="admin-loading">Chargement…</p>
  </section>
</div>
<div class="pointer-events-none fixed inset-x-0 bottom-6 z-50 flex flex-col items-center gap-2 px-4" id="toasts" aria-live="polite"></div>
</div>

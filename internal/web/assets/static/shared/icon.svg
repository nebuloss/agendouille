<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="agendouille">
  <title>agendouille : une andouille et sa tranche</title>
  <defs>
    <linearGradient id="casing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a5c45"/>
      <stop offset="1" stop-color="#4e3226"/>
    </linearGradient>
    <radialGradient id="cut" cx=".42" cy=".4" r=".7">
      <stop offset="0" stop-color="#f3d9c4"/>
      <stop offset="1" stop-color="#dcae93"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#fbeedd"/>
  <!-- the andouille: a curved, tied sausage -->
  <path d="M14 44 Q30 18 50 16" fill="none" stroke="url(#casing)" stroke-width="17" stroke-linecap="round"/>
  <path d="M12.5 38.5 Q27 15 47 11.5" fill="none" stroke="#b88a6e" stroke-width="2.6" stroke-linecap="round" opacity=".75"/>
  <!-- the strings at each end -->
  <path d="M8.6 36 L19.8 43.6" stroke="#f1e4c6" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M9.6 50.4 Q5.5 54 4.5 58 M9.6 50.4 Q5.4 50.4 3.4 52.4" fill="none" stroke="#b08550" stroke-width="2" stroke-linecap="round"/>
  <path d="M45.4 8.2 L47 24.2" stroke="#f1e4c6" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M58.2 14.8 Q61 12 62 9.2 M58.2 14.8 Q61.2 16.8 62.2 19.4" fill="none" stroke="#b08550" stroke-width="2" stroke-linecap="round"/>
  <!-- a slice in front, with the rings of an andouille de Guémené -->
  <ellipse cx="45" cy="48.5" rx="13.5" ry="12.5" fill="#2e1c14" opacity=".25"/>
  <circle cx="44" cy="46" r="13" fill="#4e3226"/>
  <circle cx="44" cy="46" r="11.4" fill="url(#cut)"/>
  <g fill="none" stroke="#9c5644">
    <circle cx="44" cy="46" r="9.6" stroke-width="1.5"/>
    <circle cx="44" cy="46" r="7.4" stroke-width="1.5"/>
    <circle cx="44" cy="46" r="5.2" stroke-width="1.5"/>
    <circle cx="44" cy="46" r="3" stroke-width="1.5"/>
  </g>
  <circle cx="44" cy="46" r="1" fill="#9c5644"/>
  <path d="M36 40 Q39 36.4 43.5 35.6" fill="none" stroke="#fff6ee" stroke-width="1.4" stroke-linecap="round" opacity=".7"/>
</svg>

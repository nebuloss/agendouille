# The build host and its trees (scripts/lib/common.sh load_conf: KEY=value,
# taken literally; the environment wins). The editing machine builds
# nothing: dev-build does, over ssh.

# Who builds.
BUILD_HOST=guillaume@10.0.50.21
# The tree scripts/remote.sh checks (and the screenshots run in).
REMOTE_DIR=agendouille
# The tree scripts/devdeploy.sh builds from, apart from the one above so a
# deploy never races a check.
DEPLOY_DIR=agendouille-deploy

# On the build host, under its $HOME: the Android SDK and the keys
# (android/Makefile). The release key signs every APK when it is there, so
# a dev build installs over a release's and the other way round.
ANDROID_DIR=android-build
RELEASE_KEYSTORE=android-build/agendouille-release.keystore
RELEASE_KEYSTORE_PASSWORD_FILE=android-build/agendouille-release.password
RELEASE_KEY_ALIAS=agendouille

# The server's architecture, for scripts/devdeploy.sh.
GOARCH=amd64
GOARM=7
